name: Bridge-Site-1
topology:
  nodes:
    graphite:
      kind: linux
      image: netreplica/graphite:latest
      env:
        HOST_CONNECTION: ${SSH_CONNECTION}
      binds:
      - __clabDir__/topology-data.json:/htdocs/default/default.json:ro
      - __clabDir__/ansible-inventory.yml:/htdocs/lab/default/ansible-inventory.yml:ro
      ports:
      - 8080:80
      exec:
      - sh -c 'graphite_motd.sh 8080'
      labels:
        graph-hide: true
    br01:
      kind: bridge
      cmd: /start.sh -sS
      exec:
      - bash -c "echo root:root | chpasswd"
      labels:
        graph-icon: bridge
        graph-level: 10
        role: bridge
        group: Bridge-Site-1
        platform: linux
        vendor: Linux
        model: Linux-Bridge
    PC1-Bridge-1:
      kind: linux
      image: netreplica/ubuntu-host:latest
      cmd: /start.sh -sS
      exec:
      - bash -c "echo root:root | chpasswd"
      - ip addr add 192.168.1.1/24 dev eth1
      labels:
        graph-icon: server
        graph-level: 10
        role: server
        group: Bridge-Site-1
        platform: linux
        vendor: Linux
        model: Server
    PC2-Bridge-1:
      kind: linux
      image: netreplica/ubuntu-host:latest
      cmd: /start.sh -sS
      exec:
      - bash -c "echo root:root | chpasswd"
      - ip addr add 192.168.1.2/24 dev eth1
      labels:
        graph-icon: server
        graph-level: 10
        role: server
        group: Bridge-Site-1
        platform: linux
        vendor: Linux
        model: Server
  links:
  - endpoints:
    - br01:eth1
    - PC1-Bridge-1:eth1
  - endpoints:
    - br01:eth2
    - PC2-Bridge-1:eth1
