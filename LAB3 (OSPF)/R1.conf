frr version 8.4_git
frr defaults traditional
hostname R1-OSPF-1
no ipv6 forwarding
!

interface eth1


 ip address 10.1.1.1/30

 no shutdown
!

interface eth2


 ip address 10.1.1.5/30

 no shutdown
!

interface lo


 ip address 172.22.22.1/32

 no shutdown
!

!





router ospf

 ospf router-id 10.1.1.1

 !



 network 10.1.1.1/30 area 0.0.0.0




 network 10.1.1.5/30 area 0.0.0.0




 network 172.22.22.1/32 area 0.0.0.0


!





!


!

end
