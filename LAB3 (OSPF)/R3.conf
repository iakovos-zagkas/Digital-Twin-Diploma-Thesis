frr version 8.4_git
frr defaults traditional
hostname R3-OSPF-1
no ipv6 forwarding
!

interface eth1


 ip address 10.1.1.6/30

 no shutdown
!

interface eth2


 ip address 10.1.1.13/30

 no shutdown
!

interface lo


 ip address 172.22.22.3/32

 no shutdown
!

!





router ospf

 ospf router-id 10.1.1.6

 !



 network 10.1.1.6/30 area 0.0.0.0




 network 10.1.1.13/30 area 0.0.0.2




 network 172.22.22.3/32 area 0.0.0.0


!





!


!

end
