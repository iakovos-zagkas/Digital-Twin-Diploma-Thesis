frr version 8.4_git
frr defaults traditional
hostname R5-OSPF-1
no ipv6 forwarding
!

interface eth1


 ip address 192.168.2.1/24

 no shutdown
!

interface eth2


 ip address 10.1.1.14/30

 no shutdown
!

interface lo


 ip address 172.22.22.5/32

 no shutdown
!

!





router ospf

 ospf router-id 192.168.2.1

 !



 network 192.168.2.1/24 area 0.0.0.2




 network 10.1.1.14/30 area 0.0.0.2




 network 172.22.22.5/32 area 0.0.0.0


!





!


!

end
